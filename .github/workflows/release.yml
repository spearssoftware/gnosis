name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      # Dispatch runs may be on a branch whose name contains '/', which can't go in a filename.
      VERSION: ${{ github.event_name == 'push' && github.ref_name || format('dev-{0}', github.sha) }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra vectors
      - run: uv run gnosis validate
      - run: uv run gnosis build
      - name: Package output
        run: |
          mkdir dist
          cp output/people.json \
             output/places.json \
             output/events.json \
             output/people-groups.json \
             output/verse-index.json \
             output/chapter-timeline.json \
             output/greek-words.json \
             output/greek-lexicon.json \
             output/gnosis.db \
             output/gnosis-lite.db \
             output/gnosis.usearch \
             output/verse-similarity.json \
             dist/
          tar -czf "dist/gnosis-$VERSION.tar.gz" -C output .
      # Dispatch runs build and upload for inspection without publishing a release.
      - name: Upload build artifacts
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: gnosis-${{ env.VERSION }}
          path: dist/*
          retention-days: 7
      - name: Create release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
